<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="과제를 제출하고 채점받는 모습을 나타낸 그림">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- 배경 장식 -->
  <circle cx="90" cy="110" r="70" fill="#c7d4ff" opacity="0.6"/>
  <circle cx="520" cy="690" r="95" fill="#c7d4ff" opacity="0.55"/>
  <circle cx="540" cy="140" r="26" fill="#ffe8a3"/>
  <circle cx="70" cy="640" r="18" fill="#b7f0d3"/>
  <path d="M470 60 l8 18 l19 3 l-14 13 l4 19 l-17 -10 l-17 10 l4 -19 l-14 -13 l19 -3 z" fill="#ffd166" opacity="0.9"/>

  <!-- 뒤쪽 서류 -->
  <rect x="150" y="215" width="300" height="380" rx="22" fill="#b9c8ff" transform="rotate(-8 300 405)"/>

  <!-- 메인 과제 카드 -->
  <g>
    <rect x="130" y="190" width="340" height="420" rx="24" fill="url(#card)" stroke="#4e73df" stroke-width="4"/>
    <rect x="130" y="190" width="340" height="74" rx="24" fill="#4e73df"/>
    <rect x="130" y="238" width="340" height="26" fill="#4e73df"/>
    <rect x="165" y="215" width="150" height="16" rx="8" fill="#ffffff"/>
    <circle cx="430" cy="227" r="14" fill="#ffffff" opacity="0.85"/>

    <!-- 체크 항목 3줄 -->
    <g>
      <circle cx="177" cy="322" r="17" fill="#1cc88a"/>
      <path d="M168 322 l7 8 l13 -15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="210" y="308" width="200" height="14" rx="7" fill="#c9d3f2"/>
      <rect x="210" y="330" width="140" height="11" rx="5.5" fill="#e1e7f8"/>
    </g>
    <g>
      <circle cx="177" cy="394" r="17" fill="#1cc88a"/>
      <path d="M168 394 l7 8 l13 -15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="210" y="380" width="180" height="14" rx="7" fill="#c9d3f2"/>
      <rect x="210" y="402" width="120" height="11" rx="5.5" fill="#e1e7f8"/>
    </g>
    <g>
      <circle cx="177" cy="466" r="17" fill="#ffffff" stroke="#f6c23e" stroke-width="5"/>
      <rect x="210" y="452" width="190" height="14" rx="7" fill="#c9d3f2"/>
      <rect x="210" y="474" width="100" height="11" rx="5.5" fill="#e1e7f8"/>
    </g>

    <!-- 점수 -->
    <rect x="165" y="520" width="270" height="62" rx="16" fill="#eef2ff"/>
    <text x="190" y="560" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#4e73df">95</text>
    <text x="236" y="560" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a89b8">/ 100</text>
    <rect x="320" y="540" width="95" height="14" rx="7" fill="#d6defa"/>
    <rect x="320" y="540" width="82" height="14" rx="7" fill="#1cc88a"/>
  </g>

  <!-- 연필 -->
  <g transform="rotate(35 470 560)">
    <rect x="440" y="470" width="34" height="190" rx="6" fill="#ffd166"/>
    <rect x="440" y="470" width="34" height="34" rx="6" fill="#f08c8c"/>
    <rect x="440" y="500" width="34" height="12" fill="#c9d3f2"/>
    <path d="M440 660 l17 40 l17 -40 z" fill="#f4d9b1"/>
    <path d="M451 686 l6 14 l6 -14 z" fill="#3b3f52"/>
  </g>

  <!-- 막대 차트 -->
  <g transform="translate(60 620)">
    <rect x="0" y="40" width="26" height="40" rx="5" fill="#9fb4f5"/>
    <rect x="38" y="20" width="26" height="60" rx="5" fill="#7893ee"/>
    <rect x="76" y="0" width="26" height="80" rx="5" fill="#4e73df"/>
  </g>
</svg>
