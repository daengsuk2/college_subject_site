<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>과제 제출</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-4 text-gray-800" th:text="${resubmit} ? '다시 제출' : '과제 제출'">과제 제출</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                <span th:text="${assignment.courseName}">강좌</span> · <span th:text="${assignment.title}">과제</span>
            </h6>
        </div>
        <div class="card-body">
            <p class="text-gray-600">
                제출 마감: <span th:text="${#temporals.format(assignment.endAt, 'yyyy-MM-dd HH:mm')}"></span>
                <span th:if="${resubmit}"> · 마감 전까지는 다시 제출하면 이전 제출이 덮어써집니다.</span>
            </p>
            <form th:action="@{/student/assignments/{id}/submit(id=${assignment.id})}"
                  th:object="${submissionRequest}" method="post" enctype="multipart/form-data" novalidate>
                <div class="form-group">
                    <label for="submissionContent">제출 내용</label>
                    <textarea id="submissionContent" th:field="*{content}" rows="10" class="form-control"
                              th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{content}"></div>
                </div>
                <!-- 첨부파일 (S3-b): 선택, 최대 10MB, 허용 형식만 -->
                <div class="form-group">
                    <label for="file">첨부파일 (선택, 최대 10MB)</label>
                    <p class="small text-gray-600 mb-1" th:if="${resubmit and currentFileName != null}">
                        현재 첨부: <a th:href="@{/submissions/{id}/file(id=${submissionId})}"
                                  th:text="${currentFileName}"></a>
                        (새 파일을 선택하면 교체되고, 선택하지 않으면 유지됩니다)
                        <button type="submit" form="deleteSubmissionFileForm" class="btn btn-outline-danger btn-sm ml-2"
                                id="deleteSubmissionFileButton">첨부 삭제</button>
                    </p>
                    <input type="file" id="file" name="file" class="form-control-file"
                           accept=".pdf,.doc,.docx,.hwp,.hwpx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.png,.jpg,.jpeg">
                    <div class="invalid-feedback d-block" th:errors="*{file}"></div>
                </div>

                <button type="submit" class="btn btn-primary" th:text="${resubmit} ? '다시 제출' : '제출'">제출</button>
                <a th:href="@{/student/assignments/{id}(id=${assignment.id})}" class="btn btn-secondary">취소</a>
            </form>
            <!-- 제출 파일 삭제 (X23): 별도 폼, POST로만 동작하며 삭제 전에 확인한다 -->
            <form th:if="${resubmit and currentFileName != null}" id="deleteSubmissionFileForm"
                  th:action="@{/student/assignments/{id}/submission/file/delete(id=${assignment.id})}" method="post"
                  onsubmit="return confirm('첨부를 삭제하시겠습니까?');"></form>
        </div>
    </div>
</div>

<!-- 파일을 고르는 순간 10MB 초과를 알려 준다 (편의 기능이며, 서버에서도 다시 검증한다) -->
<th:block layout:fragment="script">
    <script>
        document.getElementById('file').addEventListener('change', function () {
            var maxBytes = 10 * 1024 * 1024;
            if (this.files.length > 0 && this.files[0].size > maxBytes) {
                alert('파일 크기는 10MB 이하여야 합니다. (선택한 파일: '
                    + (this.files[0].size / 1024 / 1024).toFixed(1) + 'MB)');
                this.value = '';
            }
        });
    </script>
</th:block>
</body>
</html>
