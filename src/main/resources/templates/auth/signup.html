<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>학생 회원가입 - 과제 관리</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900"
          rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4">학생 회원가입</h1>
                    </div>

                    <form class="user" th:action="@{/signup}" th:object="${signupRequest}" method="post" novalidate>
                        <div class="form-group">
                            <input type="text" th:field="*{studentNo}" class="form-control form-control-user"
                                   th:classappend="${#fields.hasErrors('studentNo')} ? 'is-invalid'"
                                   placeholder="학번">
                            <div class="invalid-feedback pl-3" th:errors="*{studentNo}"></div>
                        </div>
                        <div class="form-group">
                            <input type="text" th:field="*{name}" class="form-control form-control-user"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="이름">
                            <div class="invalid-feedback pl-3" th:errors="*{name}"></div>
                        </div>
                        <div class="form-group">
                            <input type="email" th:field="*{email}" class="form-control form-control-user"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="이메일">
                            <div class="invalid-feedback pl-3" th:errors="*{email}"></div>
                        </div>
                        <div class="form-group">
                            <input type="password" th:field="*{password}" class="form-control form-control-user"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="비밀번호 (8자 이상)">
                            <div class="invalid-feedback pl-3" th:errors="*{password}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-user btn-block">가입하기</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a class="small" th:href="@{/login}">이미 계정이 있나요? 로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
