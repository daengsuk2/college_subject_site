<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>로그인 - 과제 관리</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900"
          rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                  <div class="row">
                    <!-- 왼쪽 그림 (SB Admin 2 원본 로그인 화면 구성). 좁은 화면에서는 숨긴다 -->
                    <div class="col-lg-6 d-none d-lg-block bg-login-image" id="loginImage" role="img"
                         aria-label="과제를 제출하고 채점받는 모습을 나타낸 그림"
                         th:style="'background: #eef2ff url(' + @{/img/login-illustration.svg} + ') center / cover no-repeat; min-height: 480px;'"></div>
                    <div class="col-lg-6">
                    <div class="p-5">
                        <div class="text-center">
                            <h1 class="h4 text-gray-900 mb-4">환영합니다!</h1>
                        </div>

                        <div class="alert alert-danger" th:if="${param.error}">
                            이메일 또는 비밀번호가 올바르지 않습니다.
                        </div>
                        <div class="alert alert-info" th:if="${param.logout}">
                            로그아웃 되었습니다.
                        </div>
                        <div class="alert alert-success" th:if="${param.signup}">
                            회원가입이 완료되었습니다. 로그인해 주세요.
                        </div>

                        <form class="user" th:action="@{/login}" method="post">
                            <div class="form-group">
                                <input type="email" name="email" class="form-control form-control-user"
                                       id="loginEmail" aria-describedby="emailHelp"
                                       placeholder="이메일 주소를 입력하세요..." required autofocus>
                            </div>
                            <div class="form-group">
                                <input type="password" name="password" class="form-control form-control-user"
                                       id="loginPassword" placeholder="비밀번호" required>
                            </div>
                            <div class="form-group">
                                <div class="custom-control custom-checkbox small">
                                    <input type="checkbox" name="remember-me" class="custom-control-input"
                                           id="rememberMe">
                                    <label class="custom-control-label" for="rememberMe">로그인 상태 유지</label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-user btn-block">로그인</button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a class="small" th:href="@{/signup}">계정이 없으신가요? 회원가입</a>
                        </div>
                    </div>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
