<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
        <i class="fa fa-bars"></i>
    </button>

    <ul class="navbar-nav ml-auto">
        <!-- 강사 알림 (X29): 답변을 기다리는 이의 신청. 화면을 열 때마다 새로 조회한다 -->
        <li class="nav-item dropdown no-arrow mx-1" th:if="${objectionAlerts != null}" id="objectionAlerts">
            <a class="nav-link dropdown-toggle" href="#" id="alertsDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-bell fa-fw"></i>
                <span class="badge badge-danger badge-counter" id="objectionAlertCount"
                      th:if="${objectionAlerts.count > 0}"
                      th:text="${objectionAlerts.count > 99} ? '99+' : ${objectionAlerts.count}">3</span>
            </a>
            <div class="dropdown-list dropdown-menu dropdown-menu-right shadow animated--grow-in"
                 aria-labelledby="alertsDropdown">
                <h6 class="dropdown-header">이의 신청 알림</h6>
                <a class="dropdown-item d-flex align-items-center" th:each="alert : ${objectionAlerts.items}"
                   th:href="@{/instructor/submissions/{id}/grade(id=${alert.submissionId})}">
                    <div class="mr-3">
                        <div class="icon-circle bg-warning">
                            <i class="fas fa-exclamation text-white"></i>
                        </div>
                    </div>
                    <div>
                        <div class="small text-gray-500"
                             th:text="${#temporals.format(alert.objectionAt, 'yyyy-MM-dd HH:mm')}">2026-10-21 10:00</div>
                        <span class="font-weight-bold"
                              th:text="${alert.studentName} + ' · ' + ${alert.assignmentTitle}">학생 · 과제</span>
                        <div class="small text-gray-600" th:text="${alert.courseName}">강좌</div>
                    </div>
                </a>
                <span class="dropdown-item text-center small text-gray-500" th:if="${objectionAlerts.count == 0}">
                    답변을 기다리는 이의 신청이 없습니다.</span>
                <span class="dropdown-item text-center small text-gray-500" th:if="${objectionAlerts.hasMore()}"
                      th:text="'외 ' + ${objectionAlerts.count - #lists.size(objectionAlerts.items)} + '건'">외 1건</span>
            </div>
        </li>

        <!-- 로그인하지 않은 경우 (오류 페이지 등): 로그인 링크만 표시 -->
        <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="nav-link" th:href="@{/login}">로그인</a>
        </li>

        <!-- 로그인한 경우: 이름 + 로그아웃 -->
        <li class="nav-item dropdown no-arrow" sec:authorize="isAuthenticated()">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small"
                      sec:authentication="principal.name">사용자</span>
                <i class="fas fa-user-circle fa-lg text-gray-500"></i>
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                 aria-labelledby="userDropdown">
                <a class="dropdown-item" th:href="@{/mypage}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    마이페이지
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                    로그아웃
                </a>
            </div>
        </li>
    </ul>

    <!-- 로그아웃 확인 모달 (POST /logout, CSRF 토큰 포함) -->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-hidden="true"
         sec:authorize="isAuthenticated()">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">로그아웃 하시겠습니까?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">로그아웃하려면 아래 버튼을 눌러 주세요.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-primary">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
