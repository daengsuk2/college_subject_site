spring:
  config:
    # 배포용 설정 파일(있을 때만 읽음). 서버에 환경변수를 넣을 수 없을 때 scripts/make-deploy-config.ps1 로 만든다. git에는 올라가지 않는다.
    import: optional:classpath:application-local.yml
  application:
    name: vibe-midterm
  datasource:
    # PostgreSQL 연결 정보 (.env 또는 환경변수). .env는 DotenvEnvironmentPostProcessor가 UTF-8로 읽는다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/midterm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # 파일 1개당 최대 10MB, 한 요청에 첨부 5개까지(X17) (서버에서도 FileStorage가 한 번 더 검증한다)
      max-file-size: 10MB
      max-request-size: 51MB

server:
  tomcat:
    # 업로드 한도(10MB)를 넘은 요청을 거절할 때, 남은 본문을 이 크기까지 읽어서 버린다.
    # 기본값(2MB)을 넘으면 Tomcat이 연결을 끊어 브라우저가 413 안내 화면을 받지 못하고 멈춘 것처럼 보인다.
    max-swallow-size: 100MB

# 강사 초기 계정 (U4). 비밀번호가 비어 있으면 계정을 만들지 않는다.
app:
  upload:
    # 첨부파일 저장 폴더. UUID 이름으로 저장하며 git에는 올라가지 않는다 (.gitignore의 uploads/)
    dir: ${UPLOAD_DIR:uploads}
  remember-me:
    # 로그인 상태 유지 쿠키 서명 키. 비워 두면 서버를 시작할 때마다 새로 만든다 (.env의 REMEMBER_ME_KEY)
    key: ${REMEMBER_ME_KEY:}
  instructor:
    email: ${INSTRUCTOR_EMAIL:}
    name: ${INSTRUCTOR_NAME:강사}
    password: ${INSTRUCTOR_PASSWORD:}
