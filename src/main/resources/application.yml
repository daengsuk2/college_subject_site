spring:
  application:
    name: vibe-midterm
  config:
    # 프로젝트 루트의 .env 파일을 읽어 아래 ${...} 값에 사용한다 (없으면 무시, 환경변수가 우선)
    import: optional:file:.env[.properties]
  datasource:
    # PostgreSQL 연결 정보 (.env 또는 환경변수)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/midterm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

# 강사 초기 계정 (U4). 비밀번호가 비어 있으면 계정을 만들지 않는다.
app:
  instructor:
    email: ${INSTRUCTOR_EMAIL:}
    name: ${INSTRUCTOR_NAME:강사}
    password: ${INSTRUCTOR_PASSWORD:}
