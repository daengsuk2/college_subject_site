spring:
  datasource:
    # 개발 DB(midterm)와 분리된 테스트 전용 DB. 계정 정보는 환경변수/.env를 그대로 사용한다.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/midterm_test}
  jpa:
    hibernate:
      ddl-auto: create-drop

# 테스트에서는 강사 초기 계정을 자동 생성하지 않는다 (InitialDataLoaderTest에서 직접 검증)
app:
  instructor:
    password: ""
  upload:
    # 테스트 업로드 파일은 build 폴더에 저장한다 (실제 uploads/ 폴더와 섞이지 않는다)
    dir: build/test-uploads
