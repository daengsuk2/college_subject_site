services:
  db:
    image: postgres:16
    container_name: midterm-db
    environment:
      POSTGRES_DB: midterm
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - midterm-pgdata:/var/lib/postgresql/data

volumes:
  midterm-pgdata:
